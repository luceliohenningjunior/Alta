<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuidar em Casa</title>
  <meta name="theme-color" content="#0f6e6a">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="app">
    <header class="topo">
      <a href="#inicio" class="voltar" id="voltar" aria-label="Voltar ao início" hidden>‹</a>

    <div class="faixa-rascunho" id="faixa-rascunho" hidden>RASCUNHO · conteúdo em validação pela equipe</div>

    <main id="tela" tabindex="-1"></main>

    <a class="botao-samu" href="tel:192" aria-label="Ligar para o SAMU 192">
      <span aria-hidden="true">📞</span> Ligar SAMU 192
    </a>

    <nav class="abas" aria-label="Navegação principal">
      <a href="#inicio" data-aba="inicio"><span aria-hidden="true">🏠</span>Início</a>
      <a href="#hoje" data-aba="hoje"><span aria-hidden="true">✅</span>Hoje</a>

      <a href="#contatos" data-aba="contatos"><span aria-hidden="true">☎️</span>Contatos</a>
    </nav>
  </div>

  <!-- Cartilha para impressão: montada pelo app.js, só aparece ao imprimir -->
  <div id="cartilha"></div>

  <script src="conteudo.js" charset="utf-8"></script>
  <script src="app.js" charset="utf-8"></script>

</html>
